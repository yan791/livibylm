# O site mora no domínio livibylm.com.br, publicado pelo Worker da Cloudflare
# ("npm run publicar" em app/). O GitHub Pages ficou só para quem ainda chega
# pelo endereço antigo (https://<dono>.github.io/<repositorio>/...): leva para o
# mesmo caminho no domínio. Roda a cada push na "ajustes" ou pelo "Run workflow".
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [ajustes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um push novo cancela a publicação anterior que ainda estiver rodando
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    # só publica no repositório que ligou o Pages e criou a variável PUBLICAR_PAGES = sim
    # (Settings > Secrets and variables > Actions > Variables); nos outros, é pulado em vez de falhar
    if: github.event_name == 'workflow_dispatch' || vars.PUBLICAR_PAGES == 'sim'
    runs-on: ubuntu-latest
    steps:
      # index.html e 404.html iguais: qualquer caminho antigo (/livibylm/colecao/...)
      # vai para o mesmo caminho no domínio; sem JavaScript, vai para o início
      - name: Página que leva para o domínio
        env:
          SITE: ${{ vars.LIVI_SITE || 'https://livibylm.com.br' }}
          PASTA: /${{ github.event.repository.name }}
        run: |
          mkdir -p saida
          cat > saida/index.html <<EOF
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="robots" content="noindex">
          <link rel="canonical" href="$SITE/">
          <title>Livi by LM</title>
          <script>
            var p = location.pathname, pasta = '$PASTA'
            if (p.indexOf(pasta) === 0) p = p.slice(pasta.length)
            location.replace('$SITE' + (p.charAt(0) === '/' ? p : '/' + p) + location.search + location.hash)
          </script>
          <noscript><meta http-equiv="refresh" content="0; url=$SITE/"></noscript>
          </head>
          <body><a href="$SITE/">livibylm.com.br</a></body>
          </html>
          EOF
          cp saida/index.html saida/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: saida

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
